name: Build Hoshi APK
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the APK
        run: |
          set -e
          CFG=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$CFG" ]; then echo "capacitor.config.json not found. Files in repo:"; find . -maxdepth 3 -not -path "./.git/*" | head -50; exit 1; fi
          cd "$(dirname "$CFG")"
          npm install
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets || echo "icon step skipped"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/Hoshi.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Hoshi-APK
          path: out/Hoshi.apk
          if-no-files-found: error
